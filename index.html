<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalRent - Connecting Neighbors</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#0A2463', // Deep Blue
              secondary: '#3E92CC', // Bright Blue (can be used for CTAs like search/apply)
              accent: '#FFD700', // Gold / Yellow (for highlights, premium features)
              neutral: {
                light: '#F8F9FA', // Very Light Gray (page backgrounds)
                DEFAULT: '#E9ECEF', // Light Gray (borders, dividers, disabled states)
                dark: '#6C757D', // Gray (text, icons)
                darker: '#343A40', // Darker gray for text or footers
              },
              white: '#FFFFFF',
              black: '#000000',
              danger: '#DC3545', // Red for errors/deletions
              success: '#198754', // Green for success
              warning: '#FFC107', // Yellow for warnings
              info: '#0DCAF0' // Light blue for info
            },
            animation: {
              fadeInRight: 'fadeInRight 0.3s ease-out forwards',
              fadeInDown: 'fadeInDown 0.5s ease-out forwards',
              fadeInUp: 'fadeInUp 0.5s ease-out 0.2s forwards',
              fadeIn: 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              fadeInRight: {
                from: { opacity: 0, transform: 'translateX(100%)' },
                to: { opacity: 1, transform: 'translateX(0)' },
              },
              fadeInDown: { 
                '0%': { opacity:'0', transform: 'translateY(-20px)' }, 
                '100%': { opacity:'1', transform: 'translateY(0)' } 
              },
              fadeInUp: { 
                '0%': { opacity:'0', transform: 'translateY(20px)' }, 
                '100%': { opacity:'1', transform: 'translateY(0)' } 
              },
              fadeIn: { 
                '0%': { opacity:'0' }, 
                '100%': { opacity:'1' } 
              },
            }
          }
        }
      }
    </script>
    <style>
       html, body {
         height: 100%;
       }
       body {
        background-color: #F8F9FA; /* neutral-light */
        color: #343A40; /* neutral-darker for base text */
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
       }
       #root {
         min-height: 100%;
         display: flex;
         flex-direction: column;
       }
       /* For custom scrollbars if desired */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
      .line-clamp-2 {
        overflow: hidden;
        display: -webkit-box; /* Still needed for -webkit-line-clamp to work */
        -webkit-box-orient: vertical; /* Still needed */
        -webkit-line-clamp: 2; /* For WebKit-based browsers */
        line-clamp: 2; /* Standard property, though its effect depends on other properties like display */
      }
    </style>
</head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
